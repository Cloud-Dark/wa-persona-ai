version: "3.9"

services:
  wa-persona-ai:
    build: .
    container_name: wa-persona-ai
    restart: unless-stopped
    environment:
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - WPA_ADMIN_NUMBERS=${WPA_ADMIN_NUMBERS}
      - WPA_LOG_LEVEL=${WPA_LOG_LEVEL:-info}
    volumes:
      - ./data:/app/data
      - ./config/config.yaml:/app/config/config.yaml:ro
      - ./persona:/app/persona:ro
    stdin_open: true
    tty: true          # needed for QR code display on first login
